jobs:
  deploy_deploy:
    runs-on: ubuntu-latest
    environment: $(ENVIRONMENT)
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    - name: Load Variable Groups
      id: load_variable_groups
      shell: bash
      env:
        TESTMIGRATION__CONCOURSECORE__SECRETTEST: ${{ secrets.TESTMIGRATION__CONCOURSECORE__SECRETTEST }}
        TESTMIGRATION__CONCOURSECORE__LD_API_AUTH_TOKEN: ${{ secrets.TESTMIGRATION__CONCOURSECORE__LD_API_AUTH_TOKEN }}
        TESTMIGRATION__CONCOURSECORE__APPVERSION: ${{ secrets.TESTMIGRATION__CONCOURSECORE__APPVERSION }}
      run: >-
        python3 - <<'PYEOF'

        import yaml, os, re

        with open('.github/variables/global.yaml') as f:
            all_groups = yaml.safe_load(f) or {}
        groups_to_load = ['ConcourseCore']  # Qualified names: 'Project::GroupName'

        secret_pattern = re.compile(r'^\[SECRET-FROM-REPOSECRET:(.+)\]$')

        with open(os.environ['GITHUB_ENV'], 'a') as env_file:
            for g in groups_to_load:
                group_vars = all_groups.get(g, {})
                if not group_vars:
                    print(f'Warning: Variable group {g} not found in global.yaml')
                    continue
                for k, v in group_vars.items():
                    if k.startswith('#'): continue
                    m = secret_pattern.match(str(v))
                    if m:
                        qualified = m.group(1)
                        val = os.environ.get(qualified, '')
                        if val:
                            print('::add-mask::' + val)
                            env_file.write(k + '=' + val + chr(10))
                    else:
                        env_file.write(k + '=' + str(v) + chr(10))
        PYEOF
    - name: ── Deploy ──
    - uses: actions/checkout@v4
    - name: LanchDarkly
      run: ./update-default-ld-rule.sh
      shell: bash
      working-directory: ${{ github.workspace }}/s/deploy
      env:
        API_KEY: ${{ env.LD_API_AUTH_TOKEN }}
        appVersion: ${{ env.APPVERSION }}
