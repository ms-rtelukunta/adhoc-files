name: "${{ parameters.ENVIRONMENT }}"

# File: scan-netsparker.yaml
trigger: none
pr:
  branches:
    include:
    - none

pool:
  name: 'dds-concourse-ubuntu2004-01'
  workspace:
    clean: all

parameters:
- name: ENVIRONMENT
  displayName: ENVIRONMENT
  type: string
  default: us-int
  values:
    - us-dev
    - us-qa
    - us-perf
    - us-int
    - us-stage
    - apac-stage
    - emea-stage
- name: cfg
  type: object
  default:
    endpoint: $(NETSPARKER_ENDPOINT)
    scanWebSitesProfile: $(NETSPARKER_PROFILE_ID)
    scanWebSites: $(NETSPARKER_WEBSITE_ID)
    jobOptions:
      timeoutInMinutes: 480
    autoDownload: true
- name: ctx
  type: object
  default: 
   name: "netsparker"
   display: "netsparker job"
 
variables:
- group: infra-devops-secrets
- group: ConcourseCore 
- group: ${{ parameters.ENVIRONMENT }}
- name: 'ENVIRONMENT'
  value: ${{ parameters.ENVIRONMENT }}
jobs:
- template: ../../DAST Scanner/DAST Scanner/scan-netsparker.yaml
  parameters:
    cfg: ${{ parameters.cfg }}
    ctx: ${{ parameters.ctx }}

schedules:
- cron: "0 22 * * *"
  displayName: Daily DAST Scan
  branches:
    include:
    - main
  always: true