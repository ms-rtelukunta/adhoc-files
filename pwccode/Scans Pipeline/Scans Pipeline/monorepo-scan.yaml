---
trigger: none
pr:
  branches:
    include:
      - noTrigger
schedules:
  - cron: "0 0 * * 1-5"
    displayName: Every night
    branches:
      include:
        - main
    always: true

parameters:
  - name: SCAN_TYPE
    type: string
    default: sandbox
    values:
      - sandbox
      - policy
  - name: SANDBOX_NAME
    type: string
    default: 'Concourse All Sandbox'
    values:
      - 'Concourse All Sandbox'
      - 'Release Candidate'
  - name: VERACODE_PROFILE
    type: string
    default: 'USA-ADV-concourse-microservices'
  - name: BRANCH
    type: string
    default: develop
    
  - name: nodeServiceObjects
    type: object
    default:
      - repoName: concourse-auth-svc
      - repoName: concourse-appintegrations-mgmt-svc
      - repoName: concourse-chat-svc
      - repoName: concourse-deliverables-svc
      - repoName: concourse-delivery-map-svc
      - repoName: concourse-digital-assets-svc
      - repoName: concourse-engagement-svc
      - repoName: concourse-integration-ai-svc
      - repoName: concourse-integration-ipaas-svc
      - repoName: concourse-integration-jira-svc
      - repoName: concourse-integration-miro-svc
      - repoName: concourse-integration-ms365-sharepoint-svc
      - repoName: concourse-integration-provision-svc
      - repoName: concourse-integration-pwcinternal-svc
      - repoName: concourse-notification-svc
      - repoName: concourse-pursuit-scope-svc
      - repoName: concourse-raid-svc
      - repoName: concourse-reports-svc
      - repoName: concourse-user-profile-svc

  - name: utilServiceObjects
    type: object
    default:
      - repoName: concourse-util-client-proxy
      - repoName: concourse-util-config
      - repoName: concourse-util-db
      - repoName: concourse-util-healthcheck
      - repoName: concourse-util-helpers
      - repoName: concourse-util-logger



variables:
  - name: BRANCH
    value: ${{ parameters.BRANCH }}


pool:
  name: 'dds-concourse-ubuntu2004-01'
resources:
  repositories:

    - repository: monorepo
      type: github
      name: pwc-us-adv-tech-enablement/tech-enablement
      ref: refs/heads/main
      endpoint: pwc-us-adv-tech-enablement
    

stages:
  - stage: 'veracodePrepare'
    variables:
      - group: ConcourseCore
      - name: APP_DIR
        value: ''
      - name: BUILD_TYPE
        value: 'nodejs'
    jobs:
      - job:
        displayName: ZIP MONO REPO
        variables: 
          ARTIFACTS_DIR: $(Build.ArtifactStagingDirectory)
        steps:
          - checkout: monorepo
            path: 's/monorepo'
          - script: |
              sudo npm install -g pnpm-lock-to-npm-lock
              sudo pnpm-lock-to-npm-lock ./pnpm-lock.yaml
              ls -l
          - ${{ each nodeServiceObject in parameters.nodeServiceObjects }}:
            - script: 'zip -r $(ARTIFACTS_DIR)/${{ nodeServiceObject.repoName }}.zip package-lock.json package.json apps/${{ nodeServiceObject.repoName }}/* -x "*.spec.ts" -x "*.spec.tsx"  -x "*__test__*" -x "*__tests__*" -x "*/generate-env/*" -x node_modules'
              displayName: Zip ${{ nodeServiceObject.repoName }}
          - ${{ each utilServiceObject in parameters.utilServiceObjects }}:
            - script: 'zip -r $(ARTIFACTS_DIR)/${{ utilServiceObject.repoName }}.zip package-lock.json package.json libs/${{ utilServiceObject.repoName }}/* -x "*.spec.ts" -x "*.spec.tsx"  -x "*__test__*" -x "*__tests__*" -x "*/generate-env/*" -x node_modules'
              displayName: Zip ${{ utilServiceObject.repoName }}
          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: $(ARTIFACTS_DIR)
              artifactName: 'monorepo-$(Build.BuildId)-veracode-drop'
          - script: sudo apt-get install openjdk-11-jre openjdk-11-jdk
          - ${{ if eq(parameters.SCAN_TYPE, 'sandbox') }}:
              - task: Veracode@3.19.0
                continueOnError: false
                inputs:
                  ConnectionDetailsSelection: 'Service Connection'
                  AnalysisService: van-veracode-token
                  # ConnectionDetailsSelection: 'Credentials'
                  # apiId: $(VERACODE_API_KEY_ID)
                  # apiKey: $(VERACODE_API_KEY_SECRET)
                  veracodeAppProfile: ${{ parameters.VERACODE_PROFILE }}
                  version: $(Build.BuildNumber)
                  filepath: '$(ARTIFACTS_DIR)'
                  sandboxName: '${{ parameters.SANDBOX_NAME }}'
                  createSandBox: true
                  importResults: true
                  maximumWaitTime: 360
                  optargs: '-exclude *.spec.ts,*.spec.tsx'
                  failBuildIfUploadAndScanBuildStepFails: true
                  failBuildOnPolicyFail: false